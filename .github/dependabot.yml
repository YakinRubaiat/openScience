version: 2

updates:
  # Python dependencies (pip)
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    labels:
      - dependencies
      - python
      - automated
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      pytest:
        patterns:
          - "pytest*"
      lint-and-types:
        patterns:
          - "ruff"
          - "black"
          - "mypy"
          - "bandit*"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
      - automated
    commit-message:
      prefix: "ci(deps)"
      include: scope

  # Docker base images
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
      - automated
    commit-message:
      prefix: "chore(docker)"
      include: scope
