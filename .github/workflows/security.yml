name: Security

on:
  schedule:
    # Daily at 03:00 UTC
    - cron: "0 3 * * *"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # For SARIF uploads to the Security tab
  issues: write           # For creating dependency-update report issues

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  bandit:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install bandit
        run: |
          python -m pip install --upgrade pip
          pip install "bandit[toml]"

      - name: Run bandit (SARIF)
        run: |
          bandit -r src/ -c pyproject.toml -f sarif -o bandit-results.sarif
        continue-on-error: true

      - name: Run bandit (fail on high severity)
        run: bandit -r src/ -c pyproject.toml --severity-level high

      - name: Upload bandit results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit

  dependency-vulnerabilities:
    name: Dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e . pip-audit

      - name: Run pip-audit
        run: pip-audit --strict --format json --output pip-audit.json
        continue-on-error: true

      - name: Fail if vulnerabilities found
        run: |
          VULNS=$(python -c "import json,sys; d=json.load(open('pip-audit.json')); print(sum(len(dep.get('vulns', [])) for dep in d.get('dependencies', [])))")
          if [ "$VULNS" -gt 0 ]; then
            echo "::error::pip-audit found $VULNS vulnerabilities"
            cat pip-audit.json
            exit 1
          fi

  dependency-updates:
    name: Outdated dependency report
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Check for outdated dependencies
        id: outdated
        run: |
          pip list --outdated --format json > outdated.json
          COUNT=$(python -c "import json; print(len(json.load(open('outdated.json'))))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -gt 0 ]; then
            pip list --outdated --format markdown > /tmp/outdated.md
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update dependency report issue
        if: steps.outdated.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/outdated.md', 'utf8');
            const title = '⬆️ Scheduled dependency updates available';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'dependencies,automated',
            });
            const fullBody = `The following direct/transitive dependencies have updates available:\n\n${body}\n\n_This issue is updated automatically by the Security workflow._`;
            if (issues.length > 0) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issues[0].number,
                body: fullBody,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: fullBody,
                labels: ['dependencies', 'automated'],
              });
            }
