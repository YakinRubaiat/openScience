site_name: openScience
site_description: Open-source AI workbench for scientific research — 111 agents, 330+ skills, 6 validated experiments
site_url: https://yakinrubaiat.github.io/openScience/
docs_dir: docs
repo_url: https://github.com/YakinRubaiat/openScience
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2025 openScience Contributors — MIT License

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Quickstart: quickstart.md
  - Architecture: architecture.md
  - Agent Catalog: agents.md
  - API Reference: api.md
  - Configuration: configuration.md
  - Docker Guide: docker.md
  - Development: development.md
  - Security: security.md
  - Contributing: contributing.md
  - Examples:
      - Overview: examples/index.md
      - Literature Review: examples/literature-review.md
      - RNA-seq Analysis: examples/rnaseq-analysis.md
      - Single-Cell Workflow: examples/single-cell-analysis.md
      - Publication Figures: examples/publication-figures.md
  - Library Guide: library.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md

theme:
  name: material
  language: en
  logo: assets/images/logo.png
  favicon: assets/images/logo.png
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - toc.follow

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\.)(?:\.(?!\.\s))|[。．]'

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/YakinRubaiat/openScience
    - icon: fontawesome/solid/flask
      link: https://github.com/YakinRubaiat/openScience/tree/main/experiments

extra_css:
  - assets/css/custom.css

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
