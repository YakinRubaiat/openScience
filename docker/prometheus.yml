global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'openscience-monitor'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules
rule_files:
  # - "alerts.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # API service
  - job_name: 'openscience-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:5000']
        labels:
          service: 'api'

  # PostgreSQL
  - job_name: 'postgresql'
    static_configs:
      - targets: ['db:5432']
        labels:
          service: 'database'

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'cache'
