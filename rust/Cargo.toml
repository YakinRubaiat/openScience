[package]
name = "openscience-core"
version = "0.1.0"
edition = "2021"
description = "High-performance core for openScience AI workbench"
license = "MIT"
repository = "https://github.com/YakinRubaiat/openScience"
keywords = ["science", "ai", "agents", "bioinformatics", "research"]
categories = ["science", "data-structures", "algorithms"]

[lib]
name = "openscience_core"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Data structures and algorithms
dashmap = "5.5"  # Concurrent hash map
rayon = "1.8"    # Data parallelism
parking_lot = "0.12"  # Fast synchronization primitives

# Async runtime
async-trait = "0.1"
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

# Scientific computing
ndarray = { version = "0.15", features = ["rayon"] }
nalgebra = "0.32"
statrs = "0.16"
bio = "1.5"  # Bioinformatics
chem = { version = "0.2", optional = true }

# Data formats
csv = "1.3"

# JSON Schema validation
jsonschema = "0.17"

# Python bindings (PyO3)
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py310"] }

[features]
default = ["python"]
python = ["pyo3"]
chem = ["dep:chem"]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
quickcheck = "1.0"
quickcheck_macros = "1.0"
rstest = "0.18"
tempfile = "3.8"
mockall = "0.11"
pretty_assertions = "1.4"

[[bench]]
name = "agent_benchmarks"
harness = false

[[bench]]
name = "skill_benchmarks"  
harness = false

[[bench]]
name = "orchestrator_benchmarks"
harness = false
