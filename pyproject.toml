[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "openscience"
version = "0.1.0"
description = "Open-source AI workbench for scientific research"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "click>=8.1.0",
    "flask>=2.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.14.0",
    "scikit-learn>=1.3.0",
    "requests>=2.31.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
bio = [
    "biopython>=1.81",
    "scanpy>=1.9.0",
    "anndata>=0.9.0",
    "pysam>=0.21.0",
]
chem = [
    "rdkit>=2023.3.1",
    "openmm>=8.0.0",
]
ml = [
    "torch>=2.0.0",
    "tensorflow>=2.13.0",
    "xgboost>=1.7.0",
]
viz = [
    "dash>=2.10.0",
    "bokeh>=3.1.0",
    "altair>=5.0.0",
]
api = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0",
    "PyJWT>=2.8.0",
    "passlib>=1.7.4",
    "slowapi>=0.1.9",
    "httpx>=0.27.0",
]
all = [
    "openscience[bio,chem,ml,viz,api]",
]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "bandit[toml]>=1.7.5",
    "pip-audit>=2.6.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",  # starlette TestClient dependency
]

[project.scripts]
openscience = "openscience.cli:cli"
openscience-api = "openscience.api.serve:run"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json", "*.txt"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Rules ignored to match the current codebase baseline; tighten incrementally.
ignore = [
    "B008",   # function call in default argument (intentional with FastAPI/typer-style deps)
    "BLE001", # blind except (broad handlers at app boundaries)
    "S112",   # try-except-continue
    "N999",   # invalid module name
    "EXE001", # shebang-not-executable
    "C408",   # unnecessary-collection-call
    "UP035",  # deprecated-import (transitional typing imports)
    "UP045",  # non-pep604 optional
    "UP007",  # non-pep604 union
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S110", "PLW1510", "RUF012"]  # test-code idioms: asserts, bare except-pass, subprocess without check, fixture-like class attrs

[tool.mypy]
python_version = "3.10"
strict = true

[tool.coverage.run]
source = ["openscience"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.bandit]
exclude_dirs = ["tests", "scripts", "examples"]
# Skips are intentional for this research-workbench codebase:
# B101 assert usage, B104 dev-server bind on 0.0.0.0 (guarded by env config),
# B106 demo/dev seeded credentials, B301/B403 pickle is used deliberately for
# local session persistence (documented), B112 try-except-continue in the
# plugin loader, B201 Flask debug mode is dev-only in server.py,
# B405/B314 stdlib ElementTree parses trusted PubMed API responses.
skips = ["B101", "B104", "B106", "B201", "B301", "B314", "B403", "B405", "B112"]
