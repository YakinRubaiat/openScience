# Alembic configuration for the openScience API database.
#
# The database URL is resolved from the environment variable
# OPENSCIENCE_API_DATABASE_URL, falling back to sqlalchemy.url below.

[alembic]
script_location = alembic
prepend_sys_path = src
version_path_separator = os
sqlalchemy.url = sqlite:///openscience.db

[post_write_hooks]
# hooks available: black, autoflake, ruff, isort

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
